version: "2"

linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    generated: strict

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(attributor)
  exclusions:
    generated: strict
