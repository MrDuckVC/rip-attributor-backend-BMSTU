services:
  minio:
    image: alpine/minio:latest-release
    # Том /data может принадлежать root после создания или запуска старого образа.
    user: "0:0"
    container_name: attributor-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
