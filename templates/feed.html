<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Атрибутор - Лента</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <video autoplay loop muted playsinline class="bg-video">
        <source src="{{ .videoURL }}" type="video/mp4">
    </video>

    <header class="header">
        <a href="/grid" class="logo">Атрибутор</a>
    </header>

    <div class="feed-info">
        <h2 class="feed-info-title">{{ .corpus.Author }}, {{ .corpus.Source }}</h2>

        <p class="feed-info-desc">
            {{ .corpus.Description }}<span class="feed-info-more">ещё</span>
        </p>
    </div>

    <div class="feed-sidebar">
        <div class="sidebar-item">
            <div class="circle-btn {{ if .isLiked }}active{{ end }}">
                <svg class="inner-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <span class="sidebar-text">{{ .likesCount }}</span>
        </div>

        <div class="sidebar-item">
            <div class="circle-btn">
                <span class="inner-text">СЛОВ</span>
            </div>
            <span class="sidebar-text">{{ .corpus.WordCount }}</span>
        </div>

        <div class="sidebar-item">
            <div class="circle-btn">
                <span class="inner-text">МЕСТ</span>
            </div>
            <span class="sidebar-text">{{ .corpus.PronPercent }}%</span>
        </div>

        <div class="sidebar-item">
            <div class="circle-btn">
                <span class="inner-text">ПРЕД</span>
            </div>
            <span class="sidebar-text">{{ .corpus.PrepPercent }}%</span>
        </div>

        <div class="sidebar-item">
            <div class="circle-btn">
                <span class="inner-text">СОЮЗ</span>
            </div>
            <span class="sidebar-text">{{ .corpus.ConjPercent }}%</span>
        </div>

        <a href="/corpora/{{ .corpus.ID }}?next=true" class="sidebar-item">
            <div class="circle-btn">
                <svg class="inner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </a>
    </div>

    <nav class="navbar">
        <a href="/corpora/1" class="nav-item active">Лента</a>
        <a href="/corpora/add" class="nav-item">Добавить</a>
        <a href="/corpora/grid" class="nav-item">Плитка</a>
    </nav>
</body>
</html>
