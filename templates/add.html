<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Attributor - Новый профиль</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <a href="/grid" class="logo">Attributor</a>
    </header>

    <main class="content add-page">
        <h2 class="page-heading">Новый профиль</h2>

        <div class="form-glass-card card-author-info">
            <label class="form-label label-author">Имя автора</label>
            <input type="text" class="form-input input-author" value="{{ .draft.Author }}" placeholder="Введите имя...">

            <label class="form-label label-source">Источник / Произведение</label>
            <input type="text" class="form-input input-source" value="{{ .draft.Source }}" placeholder="Укажите источник...">
        </div>

        <div class="form-glass-card card-media-info">
            <label class="form-label label-img">Файл изображения</label>
            <input type="file" class="form-input input-img" accept="image/*">

            <label class="form-label label-video">Файл фонового видео</label>
            <input type="file" class="form-input input-video" accept="video/mp4">
        </div>

        <div class="form-glass-card card-stats-info">
            <label class="form-label label-words">Объем текста в словах</label>
            <input type="number" class="form-input input-words" value="{{ .draft.WordCount }}" placeholder="1-10000000">

            <label class="form-label label-prep">Частотность предлогов (%)</label>
            <input type="number" step="0.01" class="form-input input-prep" value="{{ .draft.PrepPercent }}" placeholder="0-100">

            <label class="form-label label-pron">Частотность местоимений (%)</label>
            <input type="number" step="0.01" class="form-input input-pron" value="{{ .draft.PronPercent }}" placeholder="0-100">

            <label class="form-label label-conj">Частотность союзов (%)</label>
            <input type="number" step="0.01" class="form-input input-conj" value="{{ .draft.ConjPercent }}" placeholder="0-100">
        </div>

        <button type="button" class="btn-publish">Опубликовать профиль</button>
        <button type="button" class="btn-draft">Сохранить черновик</button>
    </main>

    <nav class="navbar">
        <a href="/feed/1" class="nav-item">Лента</a>
        <a href="/grid" class="nav-item">Плитка</a>
        <a href="/add" class="nav-item active">Добавить</a>
    </nav>
</body>
</html>
