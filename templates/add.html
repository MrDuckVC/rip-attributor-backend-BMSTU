<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Атрибутор - Новый профиль</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <a href="/corpora/grid" class="logo">Атрибутор</a>
    </header>

    <main class="add-page">
        <form action="/corpora/add" method="POST" enctype="multipart/form-data">

            <input type="hidden" name="word_count" value="0">
            <input type="hidden" name="prep_percent" value="0">

        <h1 class="add-title">Новый профиль</h1>

        <div class="form-card card-top">
            <label class="form-label" style="top: 10px;">Имя автора</label>
            <div class="form-field" style="top: 35px;">
                <input type="text" name="author" class="form-input" placeholder="Введите имя..." required>
            </div>

            <label class="form-label" style="top: 85px;">Источник / Произведение</label>
            <div class="form-field" style="top: 110px;">
                <input type="text" name="source" class="form-input" placeholder="Укажите источник..." required>
            </div>
        </div>

        <div class="form-card card-bottom">
            <label class="form-label" style="top: 10px;">Изображение</label>
            <div class="form-field" style="top: 35px;">
                <input type="file" name="image" accept="image/*" class="file-overlay" required>
                <span class="file-placeholder">Файл изображения</span>
            </div>

            <label class="form-label" style="top: 85px;">Видео</label>
            <div class="form-field" style="top: 110px;">
                <input type="file" name="video" accept="video/*" class="file-overlay" required>
                <span class="file-placeholder">Файл видео</span>
            </div>
        </div>

        <button type="submit" class="btn-submit">Далее</button>

        </form>
    </main>

    <nav class="navbar">
        <a href="/corpora/1" class="nav-item">Лента</a>
        <a href="/corpora/add" class="nav-item active">Добавить</a>
        <a href="/corpora/grid" class="nav-item">Плитка</a>
    </nav>
</body>
</html>
